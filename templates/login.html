{{define "content"}}
<p class="eyebrow">AKUN iCARE</p>
<h1>Masuk</h1>
<p class="auth-subtitle">Selamat datang kembali.</p>
{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
<form method="post" action="/login" class="form-stack">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" placeholder="contoh@email.com" required>
  <div class="label-row"><label for="password">Kata sandi</label><span class="muted-small">Minimal 8 karakter</span></div>
  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
  <button class="button button-primary button-wide" type="submit">Masuk</button>
</form>
<p class="auth-footnote">Belum punya akun? <a class="text-link" href="/register">Daftar gratis</a></p>
<p class="auth-note">Akun disimpan sementara di memori server dan akan hilang saat server dimulai ulang.</p>
{{end}}
